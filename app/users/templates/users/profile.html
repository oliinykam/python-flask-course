{% extends "base.html" %}

{% block title %}Профіль користувача{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h2 class="mb-0">Привіт, {{ username }}!</h2>
                </div>
                <div class="card-body">
                    <p class="lead">Ласкаво просимо до вашого профілю.</p>
                    <p>Ви успішно увійшли в систему.</p>
                    
                    <div class="mt-4">
                        <a href="{{ url_for('users_bp.logout') }}" class="btn btn-danger">Вийти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</div>
{% endblock %}
